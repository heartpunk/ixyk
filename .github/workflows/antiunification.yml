name: Anti-unification tests
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: au-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  au:
    name: Anti-unification tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/changes
        id: changes
      - name: Detect staged feature
        if: steps.changes.outputs.au == 'true'
        id: feature
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -f antiunification/BUILD.bazel; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif test -n "$BASE_SHA" && git cat-file -e "$BASE_SHA:antiunification/BUILD.bazel" 2>/dev/null; then
            echo 'Previously present anti-unification targets were removed' >&2
            exit 1
          else
            echo 'Feature not present yet; test gate is staged.'
          fi
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        if: steps.feature.outputs.present == 'true'
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - name: Realize Python dependencies
        if: steps.feature.outputs.present == 'true'
        run: nix develop --print-build-logs --command true
      - name: Realize the pinned REAPI launcher
        if: steps.feature.outputs.present == 'true'
        run: nix build .#reapi --out-link "$RUNNER_TEMP/ixyk-reapi"
      - name: Run AU unit, property, and held-out instruction tests
        if: steps.feature.outputs.present == 'true'
        run: |
          # This disposable Ubuntu runner restricts unprivileged namespaces.
          sudo "$RUNNER_TEMP/ixyk-reapi/bin/ixyk-reapi" --jobs 2 test \
            --test_output=errors \
            //antiunification:algebra_test \
            //antiunification:algebra_property_test \
            //extractor:model_syntax_property_test \
            //extractor:au_inputs_test \
            //extractor:normalization_test \
            //extractor:instruction_schema_test \
            //extractor:fuzz_stages_test
