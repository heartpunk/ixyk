name: Development environment

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  newcomer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/changes
        id: changes
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        if: steps.changes.outputs.newcomer == 'true'
        with:
          github_access_token: ${{ github.token }}
      - name: Realize the public development environment
        if: steps.changes.outputs.newcomer == 'true'
        run: |
          nix develop --print-build-logs --command true
          nix build .#dev-environment --out-link "$RUNNER_TEMP/ixyk-dev"
      - name: Check shell and materialized environment with fresh homes
        if: steps.changes.outputs.newcomer == 'true'
        shell: bash
        run: |
          test ! -e .bazelrc.local
          mkdir -p "$RUNNER_TEMP/shell-home" "$RUNNER_TEMP/package-home"
          env -i HOME="$RUNNER_TEMP/shell-home" PATH="$PATH" \
            nix develop --command python tools/dev_smoke.py
          env -i HOME="$RUNNER_TEMP/package-home" PATH=/usr/bin:/bin \
            "$RUNNER_TEMP/ixyk-dev/bin/ixyk-dev" python tools/dev_smoke.py

  blank-vm:
    name: Blank Ubuntu onboarding and REAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/changes
        id: changes
      - name: Test in a fresh Ubuntu cloud guest
        if: steps.changes.outputs.blank_vm == 'true'
        run: bash tools/ci_blank_vm.sh
