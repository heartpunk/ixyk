name: Lean validation
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    name: Lean validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/changes
        id: changes
      - name: Detect staged feature
        if: steps.changes.outputs.lean == 'true' || steps.changes.outputs.differential == 'true'
        id: feature
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -f lean-toolchain; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif test -n "$BASE_SHA" && git cat-file -e "$BASE_SHA:lean-toolchain" 2>/dev/null; then
            echo 'Previously present Lean toolchain was removed' >&2
            exit 1
          else
            echo 'Feature not present yet; test gate is staged.'
          fi
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        if: steps.feature.outputs.present == 'true'
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - name: Realize the pinned REAPI launcher
        if: steps.feature.outputs.present == 'true'
        run: nix build .#reapi --out-link "$RUNNER_TEMP/ixyk-reapi"
      - name: Build Lean modules and validation binaries through REAPI
        if: steps.feature.outputs.present == 'true'
        run: |
          sudo "$RUNNER_TEMP/ixyk-reapi/bin/ixyk-reapi" --jobs 2 build \
            //:lake_authority_modules //tools:ixyk_golden_check //tools:ixyk_differential_eval
      - name: Check artifact acceptance and rejection through REAPI
        if: steps.feature.outputs.present == 'true' && steps.changes.outputs.lean == 'true'
        run: |
          sudo "$RUNNER_TEMP/ixyk-reapi/bin/ixyk-reapi" --jobs 2 test \
            //tools:lean_golden_test --test_output=errors
      - name: Differential Python-Z3 versus Lean semantics through REAPI
        if: steps.feature.outputs.present == 'true' && steps.changes.outputs.differential == 'true'
        run: |
          sudo "$RUNNER_TEMP/ixyk-reapi/bin/ixyk-reapi" --jobs 2 test \
            //tools:lean_differential_test --test_output=errors
