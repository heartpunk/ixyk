name: Publish Attic dependencies
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'CITATION.cff'
  pull_request:
    paths:
      - '.github/actions/attic/**'
      - '.github/workflows/attic-publish.yml'
      - 'tools/ci_attic_restore*.py'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: attic-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.ATTIC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Restrict this environment to main before adding its write token.
    environment: attic-publish
    outputs:
      python-root: ${{ steps.closure.outputs.python-root }}
      closure-paths: ${{ steps.closure.outputs.closure-paths }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
      - uses: ./.github/actions/attic
        with:
          client-id: ${{ vars.TS_PUBLISH_CLIENT_ID }}
          audience: ${{ vars.TS_PUBLISH_AUDIENCE }}
          cache-key: ${{ vars.ATTIC_PUBLIC_KEY }}
      - name: Realize exact Linux development closure
        id: closure
        run: |
          nix develop --print-build-logs --profile "$RUNNER_TEMP/ixyk-devshell" --command true
          root=$(nix eval --raw .#devShells.x86_64-linux.default.IXYK_NIX_PYTHON_ROOT)
          echo "python-root=$root" >> "$GITHUB_OUTPUT"
          paths=$(nix-store --query --requisites "$RUNNER_TEMP/ixyk-devshell" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "closure-paths=$paths" >> "$GITHUB_OUTPUT"
      - name: Install pinned Attic client
        run: |
          revision=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          nix build "github:NixOS/nixpkgs/$revision#attic-client" --out-link "$RUNNER_TEMP/attic-client"
      - name: Publish closure
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_WRITE_TOKEN }}
        run: |
          test -n "$ATTIC_TOKEN"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/attic-config"
          "$RUNNER_TEMP/attic-client/bin/attic" login ci http://abraxas.quetzal-celsius.ts.net:8080 "$ATTIC_TOKEN"
          "$RUNNER_TEMP/attic-client/bin/attic" push ci:ixyk-ci "$RUNNER_TEMP/ixyk-devshell"
          "$RUNNER_TEMP/attic-client/bin/attic" push ci:ixyk-ci "${{ steps.closure.outputs.python-root }}"
  verify-restore:
    needs: publish
    if: >-
      !cancelled() && vars.ATTIC_ENABLED == 'true' &&
      (needs.publish.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test closure verifier
        run: python3 -m unittest discover -s tools -p ci_attic_restore_test.py
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
      - uses: ./.github/actions/attic
        with:
          client-id: ${{ github.event_name == 'pull_request' && vars.TS_CLIENT_ID || vars.TS_MAIN_CLIENT_ID }}
          audience: ${{ github.event_name == 'pull_request' && vars.TS_AUDIENCE || vars.TS_MAIN_AUDIENCE }}
          cache-key: ${{ vars.ATTIC_PUBLIC_KEY }}
      - name: Restore all published Attic dependencies without building
        env:
          PUBLISHED_CLOSURE: ${{ needs.publish.outputs.closure-paths }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # PRs smoke-test declared native roots; main verifies the full manifest.
          if [[ -z "$PUBLISHED_CLOSURE" ]]; then
            test "$EVENT_NAME" = pull_request
            PUBLISHED_CLOSURE=$(nix eval --json --max-jobs 0 --option builders '' \
              .#devShells.x86_64-linux.default --apply \
              'shell: builtins.map (name: builtins.getAttr name shell) (builtins.filter (name: builtins.match "IXYK_NIX_.*_ROOT" name != null) (builtins.attrNames shell))')
            export PUBLISHED_CLOSURE
          fi
          python3 tools/ci_attic_restore.py
      - name: Check restored Python imports
        env:
          PYTHON_ROOT: ${{ needs.publish.outputs.python-root }}
        run: |
          if [[ -z "$PYTHON_ROOT" ]]; then
            PYTHON_ROOT=$(nix eval --raw --max-jobs 0 --option builders '' .#devShells.x86_64-linux.default.IXYK_NIX_PYTHON_ROOT)
          fi
          [[ "$PYTHON_ROOT" =~ ^/nix/store/[a-z0-9]{32}-python[^/]*$ ]]
          "$PYTHON_ROOT/bin/python" -c 'import angr, claripy, hypothesis, pytest; print("Attic Python restore verified")'
