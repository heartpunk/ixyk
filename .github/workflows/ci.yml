name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/changes
        id: changes
      - name: Test CI dependency filters
        run: python3 -m unittest discover -s tools -p ci_changes_test.py
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        if: steps.changes.outputs.lint == 'true' || steps.changes.outputs.golden == 'true'
        with:
          github_access_token: ${{ github.token }}
      - name: Check Python, Bazel, and workflow sources
        if: steps.changes.outputs.lint == 'true'
        shell: bash
        run: |
          revision=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          nixpkgs="github:NixOS/nixpkgs/$revision"
          nix shell "$nixpkgs#ruff" "$nixpkgs#bazel-buildtools" "$nixpkgs#actionlint" \
            --command bash -euo pipefail -c '
              ruff check .
              buildifier -mode=check -r .
              actionlint .github/workflows/*.yml
            '
      - name: Check golden-cache inventory queries
        if: steps.changes.outputs.lint == 'true' || steps.changes.outputs.golden == 'true'
        run: nix build .#inventory-tests --no-link
