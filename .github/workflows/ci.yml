name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/changes
        id: changes
      - name: Test CI dependency filters
        run: python3 -m unittest discover -s tools -p ci_changes_test.py
      - name: Test public cache restore verification
        run: python3 -m unittest discover -s tools -p ci_cachix_restore_test.py
      - name: Read the locked IFRL revision
        id: ifrl
        run: |
          revision=$(jq -er '.nodes[.nodes.root.inputs.ifrl].locked.rev' flake.lock)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned IFRL worker source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: heartpunk/ifrl
          ref: ${{ steps.ifrl.outputs.revision }}
          path: .ifrl-worker-tests
          persist-credentials: false
      - name: Test the shared REAPI worker lifecycle and isolation settings
        env:
          IFRL_REVISION: ${{ steps.ifrl.outputs.revision }}
        run: |
          test "$(git -C .ifrl-worker-tests rev-parse HEAD)" = "$IFRL_REVISION"
          mv .ifrl-worker-tests "$RUNNER_TEMP/ifrl-worker-tests"
          PYTHONPATH="$RUNNER_TEMP/ifrl-worker-tests/python" \
            python3 -m unittest discover -s tools -p reapi_test.py
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        if: steps.changes.outputs.lint == 'true'
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - name: Check Python, Bazel, and workflow sources
        if: steps.changes.outputs.lint == 'true'
        shell: bash
        run: |
          revision=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          nixpkgs="github:NixOS/nixpkgs/$revision"
          nix shell "$nixpkgs#ruff" "$nixpkgs#bazel-buildtools" "$nixpkgs#actionlint" \
            --command bash -euo pipefail -c '
              ruff check .
              buildifier -mode=check -r .
              # The pinned actionlint predates GitHub concurrency.queue.
              actionlint -ignore '\''unexpected key "queue" for "concurrency" section'\'' .github/workflows/*.yml
            '
