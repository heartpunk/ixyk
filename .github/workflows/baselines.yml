name: Suite CI baselines
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '49 4 * * *'
permissions:
  contents: read
jobs:
  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: heartpunk/ifrl
          ref: main
          path: .ifrl-ci
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
            max-jobs = 2
            cores = 2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ifrl
          skipPush: true
      - name: Prepare public dependency access and record revisions
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
          mkdir -p ci-reports
          git rev-parse HEAD > ci-reports/revision.txt
          git -C .ifrl-ci rev-parse HEAD > ci-reports/baseline-revision.txt
      - name: Prepare the pinned worker test imports
        id: prepare
        run: nix develop --no-write-lock-file --command bash .ci/python-prepare.sh
      - name: Lint Python with the shared suite baseline
        env:
          IFRL_LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Manual runs have no event base; compare with the checked-out parent.
          if [[ -z "$IFRL_LINT_BASE_SHA" || "$IFRL_LINT_BASE_SHA" =~ ^0+$ ]]; then
            IFRL_LINT_BASE_SHA=$(git rev-parse HEAD^)
            export IFRL_LINT_BASE_SHA
          fi
          nix develop --no-write-lock-file --command python3 .ifrl-ci/ci/python.py lint
      - name: Run existing tests with branch and subprocess coverage
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: nix develop --no-write-lock-file --command bash .ci/python-coverage.sh
      - name: Preserve Python lint and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-branch-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports
          retention-days: 90
          if-no-files-found: error
  actions:
    if: github.event_name != 'schedule'
    uses: heartpunk/ifrl/.github/workflows/actions-audit.yml@main # zizmor: ignore[unpinned-uses] -- suite policy deliberately follows IFRL main
  mutation:
    if: github.event_name == 'schedule'
    uses: heartpunk/ifrl/.github/workflows/python-baseline.yml@main # zizmor: ignore[unpinned-uses] -- suite policy deliberately follows IFRL main
    with:
      baseline-ref: main
      nix-shell: '.'
      mutation: true
  lean:
    if: github.event_name != 'schedule'
    uses: heartpunk/ifrl/.github/workflows/lean-baseline.yml@main # zizmor: ignore[unpinned-uses] -- suite policy deliberately follows IFRL main
    with:
      baseline-ref: main
      nix-shell: '.'
