name: Attic over Tailscale
description: Read signed Nix closures without cache-write credentials
inputs:
  client-id:
    description: Tailscale federated identity client ID
    required: true
  audience:
    description: Tailscale federated identity audience
    required: true
  cache-key:
    description: Public signing key of the ixyk-ci cache
    required: true
runs:
  using: composite
  steps:
    - uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
      with:
        oauth-client-id: ${{ inputs.client-id }}
        audience: ${{ inputs.audience }}
        tags: tag:ixyk-ci
    - name: Enable signed Attic substitutes
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
      run: |
        [[ "$CACHE_KEY" =~ ^ixyk-ci:[A-Za-z0-9+/]{43}=$ ]]
        endpoint=http://abraxas.quetzal-celsius.ts.net:8080
        curl --fail --silent --show-error --max-time 15 "$endpoint/ixyk-ci/nix-cache-info"
        {
          echo "extra-substituters = $endpoint/ixyk-ci $endpoint/fleet"
          echo "extra-trusted-public-keys = $CACHE_KEY fleet:Vz5GVgIgYv1wSrlc3+O3KyroBNxSC1tZEP7EWjvwQbo="
        } | sudo tee -a /etc/nix/nix.conf >/dev/null
